[tox]
envlist = ruff, typing, py

[testenv]
deps =
    mcp
    pytest
commands =
    pytest -v tests/ []

[testenv:reformat]
skip_install = True
deps =
    ruff
commands =
    ruff check --fix
    ruff format

[testenv:ruff]
skip_install = True
deps =
    ruff
commands =
    ruff check
    ruff format --check

[testenv:typing]
extras = serve
deps =
    mypy
commands =
    mypy --strict src/falcon_mcp_server/
